# 研究设计 spec：口径、判据、红线。由 peerlab spec 校验：引用必须解析到脚本、registry 参数、gate 或测试。
# 数值只登记在 configs/parameter_registry.yaml；本文件用 registry_key / registry_keys 写参数名。
version: 1

question: 产品市场同侪的极端日收益（raw MAX）是否预测关联公司下月更低收益，并沿注意力-交易压力-回吐路径传导。

routes:
  - id: A
    title: 主线 A：月度定价事实 + raw MAX 事件路径
    headline: true
  - id: B
    title: 升级线 B：榜单 assignment 到实际展示的可见性识别
    headline: false
    blocked_by: G4

variables:
  - name: r_adj
    definition: 后复权日收益（close_qfq 环比）；公司行为已调整，与 outcome 的 post_adjusted 基期一致。
      不做市场/行业调整。这是 headline 收益基期（src_month_v3 起）
    implemented_by: [daily_panel_build]
  - name: rraw
    definition: 未复权日收益（raw close 环比），保留为审计列；除权日会产生伪极端收益
      （实测单日 -47% 级），不得用于 MAX 或月收益连乘
    implemented_by: [daily_panel_build, build_daily_returns]
    status: AUDIT_ONLY
  - name: MAXraw
    definition: 月内最大 rraw，仅取有效交易日；停牌日不填 0
    implemented_by: [peermax_max_build]
  - name: PeerMAXraw
    definition: 事前网络权重加权的 peer MAX，唯一 headline treatment
    implemented_by: [peermax_panel_build]
  - name: R_next
    definition: 紧邻下一自然月的 focal 月收益（outcome），口径 = registry outcome_return_convention 登记的 post_adjusted
      （后复权，含公司行为调整；与老师交付 monthly_returns_adj.csv 逐位一致）
    implemented_by: [pricing_sample_build]
  - name: R_next_raw
    definition: 同一 bridge 规则下的未复权口径 outcome，只作口径敏感性；与 R_next 来自两条不同序列
    implemented_by: [pricing_sample_build]
  - name: w_ij
    definition: 事前相似度行归一权重；无支持标 no-network-support，不填 0
    implemented_by: [network_business_edges_build, network_mda_edges_build]
  - name: OwnMAXraw
    definition: focal 自身月内最大日收益，控制变量
    implemented_by: [pricing_sample_build]
  - name: PeerReturn
    definition: 同一网络加权的 peer 月累计收益
    implemented_by: [pricing_sample_build]
  - name: PeerIVOL
    definition: FF4 残差特质波动，前 252 日窗口
    implemented_by: []
    status: NOT_IMPLEMENTED
    note: 无脚本产出；G8（因子基准）未过时该列保持 missing，机制层不启动
  - name: PeerSkew
    definition: peer 日收益偏度
    implemented_by: []
    status: NOT_IMPLEMENTED
    note: 无脚本产出；量化定义（窗口/去均值方式）未冻结
  - name: PeerID
    definition: Da-Gurun-Warachka 信息离散度
    implemented_by: []
    status: NOT_IMPLEMENTED
    note: 无脚本产出；1/3/12 月三档窗口未登记到 registry
  - name: NetworkDegree
    definition: 分析师共同覆盖网络度数（不是产品网络度数）
    implemented_by: [analyst_derived_build]
  - name: DisplayedPeerMAX
    definition: 仅在 argmax source-month 实际展示可观测时分解，否则 missing
    implemented_by: [peermax_panel_build]

sample:
  registry_keys:
    window: [sample_start, sample_end]
    complete_month: min_valid_days
    filters: sample_filter_thresholds
    iqr_scale: iqr_pool_value
  pit_rule: available_at 严格小于 month；事件前控制只取 t-1 及更早
  outcome:
    main_column: R_next
    convention_registry_key: outcome_return_convention
    sensitivity_column: R_next_raw
    sensitivity_convention: raw
    distinct_sources: true
    rule: 主口径与敏感性列必须来自两条不同序列（复权 / 未复权）；同源即视为口径登记失效
  missing_states: [missing, not_covered, not_matched, unknown_timing]
  immutable_versions: [pricing_sample_v5_teacher_only_20261120, pricing_sample_v6_adj_20261121]
  columns: [ma_teacher, mb_teacher]
  columns_note: 两列都是老师 MD&A 语料网络（M-A 中文法 / M-B TF-IDF）；没有其它语料列。

pricing_gates:
  - id: sign
    rule: beta_FM < 0（EW 与 VW 并报）
    registry_key: null
    enforced_by: [script:pricing_gate_report]
  - id: one_sided_significance
    rule: 单侧 p < alpha_pricing
    registry_key: alpha_pricing
    enforced_by: [script:pricing_gate_report]
  - id: economic_magnitude
    rule: beta < 0 且 abs(beta * IQR_pool) >= K_Econ_Pricing
    registry_key: K_Econ_Pricing
    enforced_by: [script:pricing_gate_report]
  - id: portfolio_spread
    rule: spread(High−Low) < 0 且 abs(spread) >= K_Spread_Pricing
    registry_key: K_Spread_Pricing
    enforced_by: [script:pricing_gate_report]
  - id: ew_vw_consistency
    rule: abs(beta_EW - beta_VW) <= K_Consist_Pricing，且符号一致、均显著、TOST 等价
    registry_key: K_Consist_Pricing
    enforced_by: [script:pricing_gate_report]

data_gates:
  - id: G1
    requires: 日/月收益、交易日历、公司行为调整
    enforced_by: [gate:daily-returns-board, gate:share-capital-chain]
    on_fail: 停月度定价
  - id: G2
    requires: size/BM/momentum/流动性、分析师覆盖、网络度数
    enforced_by: [gate:firm-chars-analyst-cov]
    on_fail: 停 distinctness horse race
  - id: G3
    requires: 事前网络边表与支持标记
    enforced_by: [gate:edge-build-report, gate:mda-source-identity]
    on_fail: 停 peer exposure
  - id: G4
    requires: 榜单 rank/cutoff/actual_display/规则版本
    enforced_by: []
    on_fail: 升级线 B BLOCKED，主线 A 不受影响
  - id: G5
    requires: 有独立时间戳的 attention
    enforced_by: []
    on_fail: 只保留 proxy/path evidence
  - id: G6
    requires: 买卖方向或投资者分类
    enforced_by: []
    on_fail: 停 attention 到 order-flow
  - id: G7
    requires: 公告、新闻、分析师修正、后续业绩
    enforced_by: []
    on_fail: 保留 information-diffusion 模糊
  - id: G8
    requires: 市场/行业/因子基准、factor_returns_daily
    enforced_by: []
    on_fail: 停 reversal 检验

constraints:
  - id: C1
    rule: scripts/ 平铺一层，仓库根只用 parents[1] 定位
    enforced_by: [lint:check_script_sources]
    violation: 读不到 registry、写到错误目录
  - id: C2
    rule: 改脚本名要同步注册表、测试与文档里的脚本字面量
    enforced_by: [lint:check_script_literals]
    violation: smoke 报缺脚本、测试 FileNotFoundError
  - id: C3
    rule: 同目录 import 直接 import 模块名，禁 sys.path.insert 与裸 except
    enforced_by: [lint:check_hygiene, lint:check_local_imports]
    violation: ImportError 且不降级
  - id: C4
    rule: 文本读写显式 encoding
    enforced_by: [lint:check_text_io_encoding]
    violation: 换平台按 locale 解码，数字静默变化
  - id: C5
    rule: registry 与 manifest 的行数/列名合同不许回退实测值（sha256 内容锚已退役，改以行数与列名识别输入身份）
    enforced_by: [test:tests/test_manifest_input_guard.py]
    violation: SystemExit(2)；回填等于伪造合同
  - id: C6
    rule: 命名禁阶段代号、final、版本号、序号与数字前缀；路径与脚本写下的产物名同规矩
    enforced_by: [lint:check_paths, lint:check_artifact_names]
    violation: 旧命名回流
  - id: C7
    rule: 样本键集合恰为 {ma_teacher, mb_teacher}；PANELS、PANEL_PATHS_V4、NET_DIRS
      与面板键映射只许这两个键
    enforced_by: [lint:check_teacher_only_panels, test:tests/test_teacher_only_panels.py]
    violation: 缺面板键让 check_panel_contracts 抛 FileNotFoundError，estimation-sample 无法就绪

red_lines:
  - id: R1
    rule: 缺 actual_display 时写 V=D，或把统计分位数当制度 cutoff
    enforced_by: []
  - id: R2
    rule: 把 Jackpot(q) 写成实际展示、主识别 assignment 或 monthly MAX 的等价替代
    enforced_by: []
  - id: R3
    rule: 事件后字段进入 recognizability、事件分类、样本筛选或 pre-treatment 控制
    enforced_by: [test:tests/test_available_at_guard.py]
  - id: R4
    rule: 同一 focal-date outcome 复制到多条 source-event 行
    enforced_by: []
  - id: R5
    rule: 没有可比日内时间戳却写 source-before-focal
    enforced_by: []
  - id: R6
    rule: 固定交易日窗口、event-to-month-end、next-month 三种 horizon 混进同一张表
    enforced_by: []
  - id: R7
    rule: 把缺 bridge_key 的日度结果解释为下月系数
    enforced_by: []
  - id: R8
    rule: 把 synthetic 或契约测试的通过写成 empirical pass
    enforced_by: []
  - id: R9
    rule: 未冻结 SESOI、聚类或检验族就写等价、吸收或无效应
    enforced_by: []
  - id: R10
    rule: 把搜索、换手、小单称为 retail investor 行为，或把未来低收益单独称为 reversal
    enforced_by: []

data_contracts:
  - id: a1_schema
    requires: 原始文件形状、dtype、索引与时间跨度
    enforced_by: [contract:a1_schema]
    on_fail: 停对应数据的全部阶段
  - id: a2_universe
    requires: 股票池对齐（MD&A / 月收益 / 基准矩阵）
    enforced_by: [contract:a2_universe]
    on_fail: 停依赖该池的阶段
  - id: a3_pit
    requires: 快照边界与 PIT 月份/年份上限
    enforced_by: [contract:a3_pit]
    on_fail: 停月度定价
  - id: a4_units
    requires: 量纲与取值范围（换手率 / 成交额 / 市值）
    enforced_by: [contract:a4_units]
    on_fail: 停 daily-panel 面板
  - id: a5_cliffs
    requires: 除权断崖残留与派生月收益一致性
    enforced_by: [contract:a5_cliffs]
    on_fail: 停月度定价
  - id: a6_limit_flags
    requires: 涨跌停派生口径与供应商 flag 一致率
    enforced_by: [contract:a6_limit_flags]
    on_fail: 停 MAX 资格判定
  - id: a7_return_series
    requires: 自建月收益与老师交付序列对拍
    enforced_by: [contract:a7_return_series]
    on_fail: 停月度定价
  - id: a8_flag_coverage
    requires: flag 面板覆盖率与取值域
    enforced_by: [contract:a8_flag_coverage]
    on_fail: 停样本筛除

sample_filters:
  market_value_basis: total_market_value
  st_primary: include_st
  liquidity_threshold: none_declared
  recent_ipo_months: 6
  enforced_by: [script:pricing_sample_build]

max_definition:
  return_basis: post_adjusted_close_qfq
  return_basis_note: 收益基期为 close_qfq 环比（r_adj）；src_month_v2 及以前为 raw_close（不复权），
    该口径在除权日产生伪极端收益且与 outcome 基期不一致，已在 v6 样本中退役
  registry_key: max_day_policy
  market_or_industry_adjusted: false
  enforced_by: [script:peermax_max_build]
  audit_column: MAXraw_incl_all
  la_column: MAXraw_la
  note: MAXraw 剔除涨跌停日与停牌复牌首日；MAXraw_la 另剔上市后前 listing_grace_days 个交易日
    （新股无涨跌幅限制期）；MAXraw_incl_all 为含全部日的并列列。三列并报，headline 固定为 MAXraw。
    月收益 R 与 PeerReturn 在全部 rraw 非空日上连乘（含被 MAX 剔除的涨跌停日与复牌首日），
    因此 treatment 与 control 的日样本集不同；这是已登记口径，不视为缺陷，但写方法节时必须说明

windows:
  effective: 2015-05..2023-12
  effective_note: 主口径网络版本最早为文本年 2014（available_at=2015-04-30），故 FM 首发月为 2015-05；requested 窗口见 sample.registry_keys.window。PeerIVOL 的 252 日窗口尚未实现，不构成起点约束
  segment_break: 2020-12
  segment_break_role: descriptive

inference:
  registry_key: p_direction
  nw_lag_sensitivity:
    registry_key: nw_lag_sensitivity
    rule: gate 用已存 β 序列逐 lag 重算 β/t/单侧 p；lag=nw_lag 行必须与主表一致
  multiplicity: {family: pricing_robustness, m: 19, method: BH}
  placebo:
    registry_key: placebo_draws
    p_threshold: 0.05
    rule: 经验 p=(1+#{β_k<=β_real})/(R+1)；R 与 seed_base 写入产物
  vif:
    registry_key: vif_per_month_max
    on_exceed: mark_non_interpretable
  enforced_by: [script:pricing_gate_report, script:pricing_robustness_placebo]

iqr:
  formula: IQR_POOL_TREATMENT_ONLY_v1
  formula_note: 规则 ID 与 configs/parameter_registry.yaml 的 iqr_scale_rule_id 和
    pricing_lib.IQR_POOL_RULE_ID 逐字一致；"v2" 后缀无对应实现，已废止
  registry_keys:
    value: iqr_pool_value
    drift_tolerance: iqr_drift_tolerance
  enforced_by: [script:pricing_sample_build]
