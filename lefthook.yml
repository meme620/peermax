# 提交门：pre-commit 只跑与数据无关的快速检查（<2s），pre-push 跑数据门。
# 首次使用：make env 建 .venv；lefthook install 写入 .git/hooks。
pre-commit:
  parallel: true
  commands:
    lint:
      # 跳过 codegraph 索引新鲜度：提交前工作区必然领先索引，这项只在 make lint 判。
      run: .venv/bin/python -m peerlab lint --no-codegraph
    selftest:
      run: .venv/bin/python -m pytest tests/test_peerlab_*.py tests/test_script_utils.py tests/test_gate_*.py -q

pre-push:
  commands:
    gate:
      # 退出码：0 全通过 / 1 判据违反（阻断）/ 2 缺产物 blocked
      # blocked 放行（数据门要在有数据的机器上才判得动），但必须显式提示"本次未判定"，
      # 否则 6 门全 blocked 时这道门与不存在没有区别。
      run: sh -c '.venv/bin/python -m peerlab gate; code=$?; if [ "$code" -eq 2 ]; then echo "[gate] 本次数据门未判定（缺产物）；推送放行，判据仍为未验证"; fi; [ "$code" -eq 0 ] || [ "$code" -eq 2 ]'
