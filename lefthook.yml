# 提交门：pre-commit 只跑与数据无关的快速检查（<2s），pre-push 跑数据门。
# 首次使用：make env 建 .venv；lefthook install 写入 .git/hooks。
pre-commit:
  parallel: true
  commands:
    lint:
      run: .venv/bin/python -m peerlab lint
    selftest:
      run: .venv/bin/python -m pytest tests/test_peerlab_*.py tests/test_script_utils.py tests/test_gate_*.py -q

pre-push:
  commands:
    gate:
      # 退出码：0 全通过 / 1 判据违反（阻断）/ 2 缺产物 blocked（放行，数据门在有数据的机器上才判得动）
      run: sh -c '.venv/bin/python -m peerlab gate; code=$?; [ "$code" -eq 0 ] || [ "$code" -eq 2 ]'
