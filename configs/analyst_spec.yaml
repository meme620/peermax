spec_id: analyst-spec-v1-peermax-baseline
meta:
  baseline_date: '2026-11-18'
  note: 新基线重建：键按 analyst_* 代码读取面重建，input_hashes 待数据生成后登记
inputs:
  returns: data/processed/monthly_returns_clean_v2.csv
  returns_post_adjusted: data/processed/monthly_returns_adj_full_2006_2025.csv
  market_equity: data/processed/market_equity_panel.csv
  firm_id_map: data/processed/firm_id_map.csv
  sw2_industry_latest: data/processed/sw2_industry_latest.csv
  analyst_forecast: data/processed/analyst/analyst_forecast_clean.csv
network:
  primary_version: coverage_win12_fy12_v3
  coverage_window_months: 12
  epsilon_weight: 0.0001
  cutoff_rule: month_end
  analyst_code_regex: ^A\d{5}$
  cutoff_range: 2005-12-31..2025-12-31
  cutoff_count: 241
  availability_rule: searchsorted(cutoff, side="right")
  fy_rule: Fpenddt_dt.dt.year - report_date.dt.year
  weight_formula: c / denom[i]
horizon:
  # H12 窗口共 11 个月（t-12..t-2）；≥8 为 2026-08-14 决策（smoketest_c4_min_months：
  # ≥1/≥8/≥11 结果几乎相同 0.470~0.483%/月），12 不可满足会让 h12 变体整体为空
  h12_min_available_months: 8
samples:
  signal_range: 2018-01..2025-12
sample_filters:
  market_value_basis_current: total_market_value
  market_value_basis_registry_target: total_market_value
  st_primary_current: include_st
  recent_ipo_months: 6
  microcap_rule: groupby('month')['me'].quantile(0.10)
governance:
  frozen_values_recheck:
    coverage_window: 12
    epsilon_weight: 0.0001
    sample_start: '2015-01-01'
    sample_end: '2023-12-31'
    analyst_weight_rule: equal_weight_over_common_analysts
  manifest_version: 1.0.110
  registry_version: 1.8.0-peermax-baseline
provenance:
  input_hashes: {}
  input_collections: {}
  edge_collections: {}
registered_deviations:
  - id: market_value_basis
    spec: total_market_value
    registry: total_market_value
    note: 流通市值日频序列不可得；主口径已登记为总市值（parameter_registry.market_value_basis），不再构成偏离
  - id: st_exclusion
    spec: include_st
    registry: include_st
    note: 主口径含 ST 并按焦点侧分层并报（parameter_registry.st_policy）；按原文排除 ST 的复刻需并报
  - id: sample_period_full
    spec: 2018-01..2025-12
    registry: 2015-01..2023-12
    note: analyst-network 全期复刻窗口与 registry 主线样本窗口不同口径
