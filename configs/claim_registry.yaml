    status: blocked
    blocked_reason: 'pricing_gate_status=FAIL：sign 符号 / one_sided_significance 单侧显著性 / economic_magnitude 经济量级 / portfolio_spread 组合 spread / ew_vw_consistency EW-VW 一致性 五项全未过；按 spec/design.yaml 的 pricing_gates 停止 standalone MAX-pricing claim，只保留描述性关联'
